name: Code Identifier Plugin

on:
  push:
    branches:
      - feat/code-identifier-plugin
    paths:
      - plugins/code-identifier/**
      - .github/workflows/code-identifier-plugin.yml
  pull_request:
    paths:
      - plugins/code-identifier/**
      - .github/workflows/code-identifier-plugin.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run unit tests
        working-directory: plugins/code-identifier
        run: npm test

      - name: Validate plugin manifest
        run: |
          set -euo pipefail
          node -e "const info=require('./plugins/code-identifier/info.json'); if(info.plugin_type!=='translate'||!info.id||!info.icon||!Array.isArray(info.needs)) process.exit(1)"
          test -f plugins/code-identifier/main.js
          test -f plugins/code-identifier/info.json
          test -f plugins/code-identifier/icon.svg

      - name: Package Pot plugin
        run: |
          set -euo pipefail
          mkdir -p dist
          cd plugins/code-identifier
          zip -j ../../dist/plugin.com.elio.code-identifier.potext main.js info.json icon.svg
          cd ../..
          actual="$(unzip -Z1 dist/plugin.com.elio.code-identifier.potext | sort)"
          expected="$(printf '%s\n' icon.svg info.json main.js | sort)"
          test "$actual" = "$expected"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: pot-code-identifier-plugin
          path: dist/plugin.com.elio.code-identifier.potext
          if-no-files-found: error
