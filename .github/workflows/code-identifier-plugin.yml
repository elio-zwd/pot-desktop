name: Code Identifier Plugin

on:
  push:
    branches:
      - 'feat/code-identifier-*'
    paths:
      - plugins/code-identifier/**
      - .github/workflows/code-identifier-plugin.yml
  pull_request:
    paths:
      - plugins/code-identifier/**
      - .github/workflows/code-identifier-plugin.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  ECDICT_COMMIT: bc015ed2e24a7abef49fc6dbbb7fe32c1dadaf8b

jobs:
  test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run JavaScript unit tests
        working-directory: plugins/code-identifier
        run: npm test

      - name: Test dictionary builder
        working-directory: plugins/code-identifier
        run: python scripts/test_dictionary_build.py

      - name: Download pinned ECDICT source
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            -o /tmp/ecdict.csv \
            "https://raw.githubusercontent.com/skywind3000/ECDICT/${ECDICT_COMMIT}/ecdict.csv"
          head -n 1 /tmp/ecdict.csv | grep -q '^word,phonetic,definition,translation,'

      - name: Build offline dictionary
        run: |
          set -euo pipefail
          python plugins/code-identifier/scripts/build_dictionary.py \
            --input /tmp/ecdict.csv \
            --output plugins/code-identifier/dictionary.db \
            --meta plugins/code-identifier/dictionary.meta.json \
            --source-commit "${ECDICT_COMMIT}"

      - name: Validate dictionary and manifest
        run: |
          set -euo pipefail
          node -e "const info=require('./plugins/code-identifier/info.json'); if(info.plugin_type!=='translate'||!info.id||!info.icon||!Array.isArray(info.needs)||!info.needs.some(x=>x.key==='dictionaryMode')) process.exit(1)"
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          root = Path('plugins/code-identifier')
          meta = json.loads((root / 'dictionary.meta.json').read_text(encoding='utf-8'))
          assert meta['source_file'] == 'ecdict.csv'
          assert meta['source_commit'] == 'bc015ed2e24a7abef49fc6dbbb7fe32c1dadaf8b'
          assert meta['source_license'] == 'MIT'

          connection = sqlite3.connect(root / 'dictionary.db')
          entry_count = connection.execute('SELECT COUNT(*) FROM dictionary').fetchone()[0]
          translated_count = connection.execute(
              "SELECT COUNT(*) FROM dictionary WHERE TRIM(translation) <> ''"
          ).fetchone()[0]
          alias_count = connection.execute(
              'SELECT COUNT(*) FROM dictionary WHERE is_alias = 1'
          ).fetchone()[0]
          sample_rows = connection.execute(
              "SELECT word, lemma, translation FROM dictionary ORDER BY word LIMIT 5"
          ).fetchall()
          connection.close()

          print({
              'entries': entry_count,
              'translated_entries': translated_count,
              'aliases': alias_count,
              'samples': sample_rows,
          })
          assert entry_count == meta['entries'], (entry_count, meta)
          assert entry_count > 100000, meta
          assert translated_count == entry_count
          assert sample_rows and all(row[0] and row[1] and row[2].strip() for row in sample_rows)
          PY
          test -f plugins/code-identifier/main.js
          test -f plugins/code-identifier/info.json
          test -f plugins/code-identifier/icon.svg
          test -f plugins/code-identifier/dictionary.db
          test -f plugins/code-identifier/dictionary.meta.json
          test -f plugins/code-identifier/THIRD_PARTY_NOTICES.md

      - name: Package Pot plugin
        run: |
          set -euo pipefail
          mkdir -p dist
          cd plugins/code-identifier
          zip -j ../../dist/plugin.com.elio.code-identifier.potext \
            main.js info.json icon.svg dictionary.db dictionary.meta.json THIRD_PARTY_NOTICES.md
          cd ../..
          actual="$(unzip -Z1 dist/plugin.com.elio.code-identifier.potext | sort)"
          expected="$(printf '%s\n' THIRD_PARTY_NOTICES.md dictionary.db dictionary.meta.json icon.svg info.json main.js | sort)"
          test "$actual" = "$expected"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: pot-code-identifier-plugin
          path: dist/plugin.com.elio.code-identifier.potext
          if-no-files-found: error
