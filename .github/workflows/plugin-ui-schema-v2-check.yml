name: Plugin UI Schema V2 Check

on:
    push:
        branches: [feat/plugin-ui-schema-v2]
    pull_request:
        branches: [custom/main]

permissions:
    contents: read

jobs:
    test-and-build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 21

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Schema tests
              run: node --test tests/plugin_config_schema.test.js

            - name: Build web assets
              run: pnpm build

            - name: Check whitespace errors
              run: git diff --check
