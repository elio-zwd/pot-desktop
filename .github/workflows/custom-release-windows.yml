name: Pot 社区维护版 Windows x64 构建

on:
    workflow_dispatch:
        inputs:
            release_tag:
                description: 必须等于 v + package.json version
                required: true
                default: v3.1.0-elio.1
                type: string
            publish:
                description: 阶段 A 固定为 false；true 会被明确拒绝
                required: true
                default: false
                type: boolean
            prerelease:
                description: 预留给签名发布阶段
                required: true
                default: true
                type: boolean

permissions:
    contents: read

jobs:
    windows-x64-build:
        name: Windows x64 NSIS 非发布构建
        runs-on: windows-latest
        steps:
            - name: 阶段 A 禁止发布
              if: ${{ inputs.publish }}
              shell: pwsh
              run: throw '签名 Secret、公钥和 updater 验收尚未完成，阶段 A 禁止 publish=true'

            - name: 检出代码
              uses: actions/checkout@v4

            - name: 配置 pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: 配置 Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 21
                  cache: pnpm

            - name: 输出工具版本
              shell: pwsh
              run: |
                  node --version
                  pnpm --version
                  rustc --version
                  cargo --version

            - name: 校验版本与 tag
              shell: pwsh
              run: |
                  $package = Get-Content package.json -Raw | ConvertFrom-Json
                  $expectedTag = "v$($package.version)"
                  if ('${{ inputs.release_tag }}' -ne $expectedTag) {
                      throw "release_tag 必须等于 $expectedTag"
                  }
                  "COMMUNITY_VERSION=$($package.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

            - name: 安装依赖
              shell: pwsh
              run: pnpm install --frozen-lockfile

            - name: 运行发布配置门禁
              shell: pwsh
              run: |
                  pnpm release:check
                  pnpm release:manifest:test
                  node --test tests/plugin_config_schema.test.js
                  node --test tests/plugin_result_schema.test.mjs
                  cargo check --locked --manifest-path src-tauri/Cargo.toml

            - name: 构建 Windows x64 NSIS
              shell: pwsh
              run: pnpm tauri build --bundles nsis

            - name: 整理安装包与 SHA-256
              shell: pwsh
              run: |
                  $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
                  if (-not $installer) {
                      throw '未找到 NSIS 安装包'
                  }

                  New-Item -ItemType Directory -Force -Path release-output | Out-Null
                  $outputName = "pot-community_${env:COMMUNITY_VERSION}_windows-x64-setup.exe"
                  $outputPath = Join-Path release-output $outputName
                  Copy-Item $installer.FullName $outputPath

                  $hash = (Get-FileHash $outputPath -Algorithm SHA256).Hash.ToLowerInvariant()
                  "$hash  $outputName" | Out-File -FilePath "$outputPath.sha256" -Encoding ascii

                  Write-Host "Installer: $outputPath"
                  Write-Host "SHA-256: $hash"

            - name: 上传非发布构建产物
              uses: actions/upload-artifact@v4
              with:
                  name: pot-community-${{ inputs.release_tag }}-windows-x64
                  path: release-output/*
                  if-no-files-found: error
                  retention-days: 7

            - name: 清理临时发布目录
              shell: pwsh
              run: Remove-Item release-output -Recurse -Force

            - name: 检查构建后受跟踪工作区
              shell: pwsh
              run: |
                  git diff --exit-code
                  if (git status --short) { throw '构建后工作区不干净' }
